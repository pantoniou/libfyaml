name: WebAssembly CI

run-name: >-
  ${{ github.event_name == 'pull_request'       && format('WebAssembly CI · PR #{0}', github.event.pull_request.number) ||
      github.event_name == 'workflow_dispatch'  && 'WebAssembly CI · manual' ||
      format('WebAssembly CI · {0} · {1}', github.ref_name, github.event.head_commit.message) }}

on:
  push:
    branches: [ master, stable, devel ]
  pull_request:
    branches: [ master, stable, devel ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # run JS actions on Node 24
  EMSDK_VERSION: "3.1.74"

jobs:
  wasm:
    name: Emscripten · ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: "Git Sane LF"
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf

    - name: "Checkout"
      uses: actions/checkout@v5

    - name: "Setup node"
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: "Setup Emscripten"
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: ${{ env.EMSDK_VERSION }}
        actions-cache-folder: emsdk-cache

    - name: "Install dependencies"
      run: |
        sudo apt-get update -qq
        sudo apt-get install --no-install-recommends -y ninja-build

    # the library, the tools and the tests built as WebAssembly, with threads
    - name: "Configure"
      run: |
        emcmake cmake -G Ninja -S . -B build-wasm \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_SHARED_LIBS=OFF \
          -DENABLE_LIBCLANG=OFF

    - name: "Build"
      run: cmake --build build-wasm

    # the unit tests and the YAML test suites, run under node
    - name: "Test"
      working-directory: build-wasm
      run: |
        # quiet while the tests pass; the runners are slow and some tests are flaky, so run
        # the failed ones again (with their output): a failure that stays fails the step
        ctest -j$(nproc) -Q ||
          ctest --rerun-failed --output-on-failure

    # the tools of the C reflection (cparse) are built by the script
    - name: "Test the C reflection"
      run: test/wasm/run-wasm-tests.sh build-wasm
